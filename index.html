<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>تطبيق الاعترافات</title>
    
    <!-- ===== التنسيقات (CSS) ===== -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .emoji {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }

        h1 {
            color: #2d3436;
            font-size: 24px;
            margin-bottom: 25px;
        }

        /* حقل الإدخال */
        #message {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
            text-align: right;
        }

        #message:focus {
            border-color: #6c5ce7;
        }

        /* زر الإرسال */
        .send {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }

        .send:active {
            transform: scale(0.97);
        }

        /* رسائل الحالة */
        #statusMessage {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
        }

        #statusMessage.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        #statusMessage.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        #statusMessage.loading {
            display: block;
            background: #fff3cd;
            color: #856404;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #b2bec3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الإيموجي -->
        <span class="emoji"></span>
        
        <h1> آمن </h1>
        
        <!-- ===== نموذج الإدخال ===== -->
        <form id="confessionForm">
            <input 
                type="text" 
                id="message" 
                placeholder="اكتب هنا..." 
                required
            />
            <button type="submit" class="send"> إرسال </button>
            <div id="statusMessage"></div>
        </form>
        
        <div class="footer">🔒 رسالتك تصل لبريدك بدون معرفة هويتك</div>
    </div>

    <!-- ===== تحميل مكتبة EmailJS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>

    <!-- ===== كود الجافاسكريبت ===== -->
    <script>
        // =====================================================
        // 1. تهيئة EmailJS بمفتاحك العام
        // =====================================================
        <script>
    // تهيئة EmailJS بمفتاحك العام
    emailjs.init("QM7LKS4FocUE576Cs");

    const form = document.getElementById('confessionForm');
    const messageInput = document.getElementById('message');
    const statusDiv = document.getElementById('statusMessage');

    function showStatus(msg, type = 'success') {
        statusDiv.textContent = msg;
        statusDiv.className = type;
        clearTimeout(statusDiv._timeout);
        statusDiv._timeout = setTimeout(() => {
            statusDiv.className = '';
            statusDiv.textContent = '';
        }, 6000);
    }

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        const message = messageInput.value.trim();

        if (!message) {
            showStatus('⚠️ الرجاء كتابة رسالة', 'error');
            return;
        }

        showStatus('⏳ جاري الإرسال...', 'loading');

        const templateParams = {
            message: message,
            time: new Date().toLocaleString('ar-EG')
        };

        // إرسال الإيميل
        emailjs.send('service_zm8jhnp', 'template_y2xk6zj', templateParams)
            .then(function(response) {
                console.log('✅ تم الإرسال بنجاح!', response);
                showStatus('✅ تم إرسال اعترافك بنجاح!', 'success');
                messageInput.value = '';
            })
            .catch(function(error) {
                console.error('❌ تفاصيل الخطأ:', error);
                
                // رسائل خطأ مفهومة
                let errorMsg = '❌ حدث خطأ، حاول مرة أخرى';
                if (error.status === 403) {
                    errorMsg = '❌ خطأ في المفتاح العام، تحقق من API Key';
                } else if (error.status === 404) {
                    errorMsg = '❌ معرف الخدمة أو القالب غير صحيح';
                } else if (error.status === 400) {
                    errorMsg = '❌ تأكد من محتوى القالب في EmailJS';
                } else if (error.text) {
                    errorMsg = `❌ ${error.text}`;
                }
                
                showStatus(errorMsg, 'error');
            });
    });

    console.log('✅ تطبيق الاعترافات جاهز!');
    console.log('📧 الخدمة:', 'service_zm8jhnp');
    console.log('📧 القالب:', 'template_y2xk6zj');
</script>
    </script>

</body>
</html>
